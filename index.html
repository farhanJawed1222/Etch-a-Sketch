<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-a-Sketch</title>
    <link rel="stylesheet" href="style.css">
    <script src="./script.js" defer></script>
</head>

<body>
    <main class="sketch__wrapper">
        <h1 class="sketch__heading">Etch-a-Sketch</h1>
        <p class="sketch__intro">A light-weight drawing web-app built on HTML, CSS, and vanilla JavaScript.</p>

        <div class="start__container">
            <input type="range" name="size" class="grid__slider"  min="1" max="100" value="30">

            <button class="clean__btn">Clean</button>
        </div>

        <div class="grid__container">
            <!-- grid cell -->
        </div>

        <footer class="repo__link">
            <a href="https://github.com/farhanJawed1222/Etch-a-Sketch" target="_blank" rel="noopener noreferrer">View on
                GitHub</a>
        </footer>
    </main>
</body>

</html>
